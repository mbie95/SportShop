version: '3.1'

services:
  sportshop-mysql:
    image: mysql
    restart: always
    container_name: "sport-shop-mysql"
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - "3306:3306"
    volumes:
      - ./data.sql:/docker-entrypoint-initdb.d/data.sql
      - sport-shop-mysql-data:/var/lib/mysql

  sportshop-redis:
    image: "redis:latest"
    container_name: "sport-shop-redis-container"
    ports:
      - "6379:6379"
    volumes:
      - sport-shop-redis-data:/data

volumes:
  sport-shop-redis-data:
  sport-shop-mysql-data: